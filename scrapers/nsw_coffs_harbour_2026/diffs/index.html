<style>

* { box-sizing: border-box; }

.pair { min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.pair h3 { margin: 0 0 6px; font-size: 15px; overflow-wrap: anywhere; }
.counts-wrap { overflow-x: auto; }
.counts { border-collapse: collapse; font-size: 13px; width: 100%; }
.counts th, .counts td { padding: 2px 6px; text-align: right; white-space: nowrap; }

.counts tbody th { text-align: left; }

.place { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin: 6px 0; }
.place h3 { margin: 0 0 4px; font-size: 15px; overflow-wrap: anywhere; }
.events { list-style: none; margin: 0; padding: 0; }
.events li { display: grid; grid-template-columns: minmax(120px, 210px) 1fr; gap: 10px; padding: 3px 0; border-top: 1px solid var(--border); font-size: 14px; }
.events li:first-child { border-top: 0; }
.when { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.kind { font-size: 12px; border-radius: 999px; padding: 1px 7px; margin-right: 6px; }
.kind.added { background: var(--add-soft); color: var(--add); }
.kind.removed { background: var(--del-soft); color: var(--del); }
.kind.changed { background: var(--accent-soft); color: var(--accent); }
.kind.possible { background: var(--warn-soft); color: var(--warn); }
@media (max-width: 640px) {

const DATA = JSON.parse(document.getElementById("data").textContent);
