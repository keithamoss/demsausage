  document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String((c.dataset.cat || null) === cat)));
  applyFilters();
}
let searchText = "";
function applyFilters() {
  const root = document.getElementById("view");
  root.querySelectorAll(".card").forEach((c) => {
    const okText = !searchText || (c.dataset.search || "").includes(searchText);
    const okCat = !activeChip || (c.dataset.cats || "").split(" ").includes(activeChip);
    const okReview = !(hideReviewed && c.classList.contains("reviewed"));
    c.style.display = okText && okCat && okReview ? "" : "none";
  });
}
function filter(root, q) { searchText = q.trim().toLowerCase(); applyFilters(); }
function summaryText(d) {
  const s = d.summary, lines = [];
  lines.push(`${d.old.label || d.old.path.split("/").pop()} → ${d.new.label || d.new.path.split("/").pop()} (${label(d.matcher)})`);
  if (d.loader && d.loader.config_found) {
    const look = d.loader.fix_audit.filter(fixNeedsLook), probs = d.loader.problems.length + d.loader.regex_errors.length;
    if (probs) lines.push(`Load problems: ${probs}`);
    if (look.length) lines.push(`Config fixes to look at: ${look.map((f) => `#${f.number} (${f.status.replace("_", " ")})`).join(", ")}`);
  }
  if (d.nothing_changed) { lines.push(`No changes: all ${d.new.records} places are the same.`); return lines.join("\n"); }
  lines.push(`${d.new.records} places: ${s.changed} changed, ${s.added} added, ${s.removed} removed, ${s.possible_matches} possible matches, ${s.likely_replacements} likely replacements.`);
  if (d.added.length) lines.push(`Added: ${d.added.map((a) => a.name).join("; ")}`);
  if (d.removed.length) lines.push(`Removed: ${d.removed.map((r) => r.name).join("; ")}`);
  for (const p of d.replacements) lines.push(`Likely replacement: ${p.old_name} → ${p.new_name} (${fmtM(p.distance_m)})`);
  if (d.changed.length) lines.push("Changed:", ...d.changed.map((e) => `- ${e.name}: ${[...e.changes.filter((c) => !c.cosmetic).map((c) => c.field), ...(e.location ? [`moved ${fmtM(e.location.moved_m)}`] : [])].join(", ")}`));
  if ((d.cosmetic || []).length) lines.push(`Cosmetic only (not counted): ${d.cosmetic.length} places.`);
  const warns = d.changed.concat(d.possible_matches).flatMap((e) => e.warnings.map((w) => `${e.name}: ${w}`));
  if (warns.length) lines.push("Warnings:", ...warns.map((w) => `- ${w}`));
  return lines.join("\n");
}
async function copyText(text, button) {
  let ok = true;
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    try { const t = h("textarea", {}, text); document.body.append(t); t.select(); ok = document.execCommand("copy"); t.remove(); }
    catch (e2) { ok = false; }
  }
  const message = ok ? "Copied" : "Copy failed";
  if (!button.dataset.label) button.dataset.label = button.textContent;
  clearTimeout(button._copyTimer);
  button.textContent = message;  // seen
  announce(message);             // heard
  button._copyTimer = setTimeout(() => { button.textContent = button.dataset.label; }, 1600);
}


// ---------- loader checks (the loader's own rules, via loader_rules) ----------
const FIX_STATUS = {
  missing_field: ["Overwrites a field that doesn't exist after renaming, so the loader skips it", "warn"],
  stopped_matching: ["Stopped matching in this scrape: the selector no longer finds the place", "warn"],
  no_match: ["Doesn't match any place (orphan): can probably be removed", "warn"],
  already_fixed: ["Source already has the fixed value: the entry can probably be removed", "warn"],
  multiple: ["Matches more than one place: it will change all of them", "warn"],
  applies: ["Still applies", "ok"],
};
const fixNeedsLook = (f) => f.status !== "applies";
function configFixCard(f) {
  const key = `cfgfix-${f.number}`;
  const [text, tone] = FIX_STATUS[f.status] || [f.status, "warn"];
  return h("div", { ...reviewAttrs(key), "data-search": f.matches.join(" ").toLowerCase() },
    cardHead(`fix_data_issues entry ${f.number}: ${f.fix.field} = ${JSON.stringify(f.fix.value)}`, key),
    h("div", { class: tone === "warn" ? "warn" : "allclear" }, text,
      f.translates_value ? ` (translates a value: ${f.matches.length} places)` : f.matches.length ? ` (${f.matches.length} place${f.matches.length === 1 ? "" : "s"})` : ""),
    f.missing_fields.length ? h("p", {}, `Missing after renaming: ${f.missing_fields.join(", ")}. Check the spelling against the loader's column names (e.g. lon, not lng).`) : null,
    !f.translates_value && f.matches.length ? h("p", { class: "note" }, `Matches: ${f.matches.slice(0, 6).join("; ")}${f.matches.length > 6 ? "…" : ""}`) : null,
    !f.translates_value && f.source_values.length ? h("p", { class: "note" }, `This scrape has: ${f.source_values.slice(0, 3).map((v) => JSON.stringify(v)).join("; ")}`) : null,
    h("pre", { class: "fixjson" }, JSON.stringify(f.fix, null, 4)));
}
function loadProblemCard(p) {
  const key = `load-${p.new_index}`;
  return h("div", { ...reviewAttrs(key), "data-search": p.name.toLowerCase() },
    cardHead(p.name, key), h("ul", {}, p.problems.map((x) => h("li", {}, x))));
}
function renderLoaderChecks(d) {
  const L = d.loader;
  if (!L) return null;
  if (!L.config_found) return section("Loader checks", [], () => null, false,
    h("p", { class: "note" }, "No config.json beside this diffs folder, so the loader checks didn't run."));
  const look = L.fix_audit.filter(fixNeedsLook), fine = L.fix_audit.filter((f) => !fixNeedsLook(f));
  const intro = h("p", { class: "note" },
    `Uses the loader's own rules (loader_rules.py) with this election's config.json. ${L.rows_after_filters} places after its filters. `,
    "Load problems are what the loader would reject, as far as can be checked without the database: required fields, allowed values, coordinates and cleaning regexes.");
  return [
    section("Loader: config fixes to look at", look, configFixCard, true, intro),
    section("Loader: config fixes that still apply", fine, configFixCard, false),
    section("Loader: problems that would stop the load", L.problems, loadProblemCard, true,
      L.regex_errors.length ? h("div", { class: "warn" }, h("b", {}, "Cleaning regex errors: "), L.regex_errors.slice(0, 10).join("; ")) : null),
  ];
}

function renderDiff(d) {
  const s = d.summary;
  const warned = d.changed.concat(d.possible_matches).filter((e) => e.warnings.length);
  const counts = {};
  for (const e of d.changed.concat(d.possible_matches)) for (const c of entryCategories(e)) counts[c] = (counts[c] || 0) + 1;
  const cats = Object.keys(CATEGORY_LABEL).filter((c) => counts[c]);
  activeChip = null; searchText = "";
  const card = (e) => pairCard(e, d);
  s.load_problems = d.loader && d.loader.config_found ? d.loader.problems.length + d.loader.regex_errors.length : 0;
  s.config_fixes = d.loader && d.loader.config_found ? d.loader.fix_audit.filter(fixNeedsLook).length : 0;
  // Likely-needed fixes first, then "only if wrong", then the "no fix needed" notes.
  const fixes = (d.suggested_fixes || []).slice().sort((a, b) => (b.likely - a.likely) || (a.no_fix_needed - b.no_fix_needed));
  const copyable = fixes.filter((f) => f.fix);
  const wrap = h("div", {},
    h("div", { class: "tiles" },
      [["load_problems", "Load problems"], ["config_fixes", "Config fixes to check"], ["changed", "Changed"], ["added", "Added"], ["removed", "Removed"], ["possible_matches", "Possible matches"], ["likely_replacements", "Likely replacements"], ["warnings", "Warnings"], ["quality_issues", "Data quality"], ["unchanged", "Unchanged"], ["cosmetic", "Cosmetic only"]]
        .filter(([k]) => (s[k] ?? 0) > 0 || ["changed", "added", "removed"].includes(k))
        .map(([k, t]) => h("div", { class: "tile" }, h("b", {}, s[k] ?? 0), h("span", {}, t)))),
    d.nothing_changed ? h("div", { class: "allclear" }, h("b", {}, "No changes. "),
      `All ${d.new.records} places in ${d.new.label || "the new file"} are the same as in ${d.old.label || "the old file"}.`) : null,
    renderMap(d),
    h("div", { class: "toolbar" },
      h("input", { type: "search", "aria-label": "Filter places by name", placeholder: "Filter by name…", oninput: (ev) => filter(wrap, ev.target.value) }),
      h("label", { class: "review hide-toggle" }, h("input", { type: "checkbox", checked: hideReviewed, onchange: (ev) => { hideReviewed = ev.target.checked; applyFilters(); } }), "Hide reviewed"),
      h("button", { class: "ghost", id: "download-review", title: "Save your ticks to a file, then: uv run ppdiff reviewed import FILE --diffs-dir <this diffs folder>", onclick: downloadReview }, "Download review"),
      h("button", { class: "ghost", onclick: (ev) => copyText(summaryText(d), ev.currentTarget) }, "Copy summary")),
    cats.length ? h("div", { class: "chips" },
      h("button", { class: "chip", "aria-pressed": "true", onclick: () => setChip(null) }, "All changes"),
      cats.map((c) => h("button", { class: "chip", "data-cat": c, "aria-pressed": "false", onclick: () => setChip(activeChip === c ? null : c) }, `${CATEGORY_LABEL[c]} ${counts[c]}`))) : null,
    d.columns.added.length || d.columns.removed.length
      ? h("div", { class: "warn" }, `Columns added: ${d.columns.added.join(", ") || "none"} · removed: ${d.columns.removed.join(", ") || "none"}`)
      : null,
    renderLoaderChecks(d),
    section("Warnings", warned, (e) => pairCard(e, d, "warning"), true),
    section("Suggested config fixes", fixes, (f) => fixCard(f, d), true,
      h("div", { class: "fix-intro" },
        h("p", { class: "note" }, "Drafts for the fix_data_issues list in this election's config.json. Check the map before using one: each keeps the previous value, which is only right if the new file is wrong."),
        copyable.length ? h("button", { class: "ghost small", onclick: (ev) => copyText(fixJSON(copyable.map((f) => f.fix)), ev.currentTarget) }, `Copy all ${copyable.length} as a list`) : null)),
    section("Possible matches (review band)", d.possible_matches, card, true),
    section("Likely replacements (removed + added nearby)", d.replacements, (p) => replacementCard(p, d), true),
    section("Changed", d.changed, card, true),
    section("Added", d.added, (e) => recordCard(e, d, "added"), true),
    section("Removed", d.removed, (e) => recordCard(e, d, "removed"), true),
    section("Cosmetic changes only (not counted as changes)", d.cosmetic || [], card, false,
      h("p", { class: "note" }, "Values that the linkage module treats as the same: case, punctuation, spacing, address abbreviations (St/Street), number formatting, and how times are written.")),
    section("Data quality", d.quality, (q) => qualityCard(q, d), d.quality.length > 0),
    h("p", { class: "note" }, `Matcher: ${label(d.matcher)}. Ignored columns: ${d.columns.ignored.join(", ") || "none"}. Keys: j / k next / previous card, x tick reviewed.`));
  return wrap;
}

// ---------- disagreements + verdicts ----------
function placeLines(r) {
  return h("dl", { class: "kv" },
    r.premises ? [h("dt", {}, "premises"), h("dd", {}, r.premises)] : null,
    h("dt", {}, "address"), h("dd", {}, val(r.address)),
    h("dt", {}, "location"), h("dd", {}, r.lat !== null ? h("a", { href: gmaps(r.lat, r.lon), target: "_blank", rel: "noopener", title: "Open in Google Maps" }, `${r.lat}, ${r.lon}`) : val("")),
    r.divisions && r.divisions.length ? [h("dt", {}, "divisions"), h("dd", {}, r.divisions.join(", "))] : null);
}
function decisionBox(matcher, dec) {
  return h("div", { class: "decision" },
    h("h3", {}, label(matcher)),
    dec === null
      ? h("div", { class: "nolink" }, "No link: treats this place as removed")
      : [h("div", {}, h("b", {}, dec.right.name)), placeLines(dec.right),
         h("div", { class: "badges" }, h("span", { class: "badge" + (dec.band === "review" ? " review" : "") }, dec.band), h("span", { class: "badge" }, dec.via === "exact" ? "exact key" : `score ${dec.score}`)),
         explainLine(dec.explain)]);
}
function verdictCard(item) {
  const idx = item.left.index;
  const v = VERDICTS[idx] || {};
  const name = `verdict-${idx}`;
  const card = h("div", { class: "card" + (v.verdict ? " done" : ""), id: `dis-${idx}`, "data-search": item.left.name.toLowerCase() });
  const set = (patch) => {
    VERDICTS[idx] = Object.assign({}, VERDICTS[idx], patch, { updated_at: new Date().toISOString() });
    card.classList.toggle("done", Boolean(VERDICTS[idx].verdict));
    saveVerdicts(); renderTabs();
  };
  const options = DIS.matchers.map((m) => [m, `${label(m)} was right`]).concat([["neither", "Both wrong"], ["both", "Both defensible"]]);
  const headingId = `dis-${idx}-name`;
  card.append(
    h("h2", { id: headingId }, item.left.name), h("div", { class: "was" }, "in the old file"), placeLines(item.left),
    h("div", { class: "decisions" }, DIS.matchers.map((m) => decisionBox(m, item.decisions[m]))),
    h("div", { class: "verdict", role: "radiogroup", "aria-label": `Who was right about ${item.left.name}` }, options.map(([key, text]) =>
      h("label", {}, h("input", { type: "radio", name, value: key, checked: v.verdict === key, onchange: () => set({ verdict: key }) }), h("span", {}, text)))),
    h("div", { class: "verdict-extra" },
      h("select", { "aria-label": "Reason", "aria-describedby": headingId, onchange: (ev) => set({ reason: ev.target.value }) },
        h("option", { value: "" }, "Reason…"),
        DATA.reasons.map((r) => h("option", { value: r, selected: v.reason === r }, r))),
      h("textarea", { rows: 1, placeholder: "Note (optional)", "aria-label": "Note (optional)", "aria-describedby": headingId, oninput: (ev) => set({ note: ev.target.value }) }, v.note || "")));
  return card;
}
function renderDisagreements() {
  const wrap = h("div", {},
    h("p", { class: "note" }, `The matchers agree on ${DIS.agree} of ${DIS.left_records} places in the old file. These are the rest. Pick who was right; your choices are saved in this browser until you download them.`),
    h("div", { class: "toolbar" },
      h("input", { type: "search", "aria-label": "Filter places by name", placeholder: "Filter by name…", oninput: (ev) => filter(wrap, ev.target.value) }),
      h("button", { class: "ghost", onclick: () => { if (confirm("Clear all verdicts for this pair of files in this browser?")) { VERDICTS = {}; saveVerdicts(); render(); } } }, "Clear verdicts")),
    DIS.items.length ? DIS.items.map(verdictCard) : h("p", { class: "note" }, "No disagreements: both matchers made the same links."));
  return wrap;
}
// Keep scroll-padding-bottom equal to the fixed bar's height, so focused controls aren't hidden under it (WCAG 2.4.11).
new ResizeObserver(([entry]) => document.documentElement.style.setProperty("--bar-h", `${Math.ceil(entry.target.getBoundingClientRect().height)}px`))
  .observe(document.getElementById("bar"));
function updateBar() {
  const bar = document.getElementById("bar");
  if (!DIS || current !== "disagreements") { bar.classList.remove("show"); return; }
  const done = DIS.items.filter((it) => VERDICTS[it.left.index] && VERDICTS[it.left.index].verdict);
  document.getElementById("bar-status").textContent = `${done.length} of ${DIS.items.length} reviewed`;
  document.getElementById("download").disabled = done.length === 0;
  bar.classList.add("show");
}
document.getElementById("download").addEventListener("click", () => {
  const records = DIS.items.filter((it) => VERDICTS[it.left.index] && VERDICTS[it.left.index].verdict).map((it) => {
    const v = VERDICTS[it.left.index];
    const decisions = {};
    for (const m of DIS.matchers) {
      const d = it.decisions[m];
      decisions[m] = d ? { right: d.right, score: d.score, band: d.band, via: d.via } : null;
    }
    return {
      schema_version: DATA.verdict_schema_version, recorded_at: v.updated_at, election: DIS.election,
      old_file: DIS.old_file, new_file: DIS.new_file, old_sha256: DIS.old_sha256, new_sha256: DIS.new_sha256,
      left: it.left, decisions, verdict: v.verdict, reason: v.reason || "", note: v.note || "",
    };
  });
  const blob = new Blob([JSON.stringify(records, null, 2)], { type: "application/json" });
  const a = h("a", { href: URL.createObjectURL(blob), download: `verdicts ${DIS.election} ${DIS.old_label || DIS.old_file} to ${DIS.new_label || DIS.new_file}.json`.replace(/[,:]/g, "") });
  document.body.append(a); a.click(); a.remove();
});


// ---------- keyboard: j/k next/previous card, x tick reviewed ----------
let kbdCard = null;
function visibleCards() {
  return [...document.querySelectorAll("#view .card[data-review]")].filter((c) => c.offsetParent !== null && !c.closest(".section-body[hidden]"));
}
function focusCard(card) {
  if (kbdCard) kbdCard.classList.remove("kbd");
  kbdCard = card;
  if (card) { card.classList.add("kbd"); card.scrollIntoView({ block: "center", behavior: reduceMotion() ? "auto" : "smooth" }); }
}
document.addEventListener("keydown", (ev) => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
  const cards = visibleCards();
  if (!cards.length) return;
  const i = cards.indexOf(kbdCard);
  if (ev.key === "j") focusCard(cards[Math.min(i + 1, cards.length - 1)]);
  else if (ev.key === "k") focusCard(cards[Math.max(i - 1, 0)]);
  else if (ev.key === "x" && kbdCard) setReviewed(kbdCard.dataset.review, !REVIEWED[kbdCard.dataset.review]);
  else return;
  ev.preventDefault();
});

render();
</script>
