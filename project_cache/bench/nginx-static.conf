server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /keys/public.test.democracysausage.org.pem;
    ssl_certificate_key /keys/public.test.democracysausage.org-key.pem;
    root /static;
    gzip on;
    gzip_types application/json application/geo+json;
    gzip_min_length 256;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=60" always;
    types { application/json json; application/geo+json geojson; }
}
