[project]
name = "demsausage-diff"
version = "0.1.0"
description = "Diffs two polling place files using record linkage results, one diff per matcher, with an HTML report."
requires-python = ">=3.10,<4.0"
dependencies = [
    "demsausage-linkage[splink]",
]

[project.scripts]
ppdiff = "ppdiff.cli:main"

[tool.uv.sources]
demsausage-linkage = { path = "../linkage", editable = true }

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
