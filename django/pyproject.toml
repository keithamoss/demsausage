[project]
name = "demsausage"
version = "0.1.0"
description = ""
requires-python = ">=3.10,<4.0"
authors = [{ name = "Keith Moss", email = "keithamoss@gmail.com" }]
license = { text = "GPL3" }
keywords = []
dependencies = [
    "Django>=4.2.16,<5.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "djangorestframework>=3.15.2,<4.0.0",
    "django-cors-headers>=4.4.0,<5.0.0",
    "django-model-utils>=5.0.0,<6.0.0",
    "googlemaps>=4.10.0,<5.0.0",
    "gunicorn>=23.0.0,<24.0.0",
    "gevent>=24.2.1,<25.0.0",
    "greenlet>=3.0.0,<4.0.0",
    "social-auth-app-django>=5.4.2,<6.0.0",
    "social-auth-core>=4.5.4,<5.0.0",
    "sentry-sdk>=2.14.0,<3.0.0",
    "django-simple-history>=3.7.0,<4.0.0",
    "jsonschema>=4.23.0,<5.0.0",
    "django-pymemcache>=1.0.0,<2.0.0",
    "djangorestframework-gis>=1.0,<2.0",
    "django-filter==21.1",
    "djangorestframework-csv>=2.1.1,<3.0.0",
    "requests>=2.31.0,<3.0.0",
    "chardet>=5.2.0,<6.0.0",
    "drf-spectacular>=0.27.2,<0.28.0",
    "selenium>=4.24.0,<5.0.0",
    "pytz>=2024.2,<2025.0",
    "rq>=1.16.2,<2.0.0",
    "django-rq>=2.10.2,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.8,<5.0",
    "pytest-mock>=3.14,<4.0",
    "pytest-xdist>=3.0,<4.0",
    "factory-boy>=3.3,<4.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "demsausage.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = "--no-migrations -n auto -m 'not slow'"
markers = [
    "slow: marks tests as slow (full-load integration tests; run with -m slow or --run-slow)",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]
